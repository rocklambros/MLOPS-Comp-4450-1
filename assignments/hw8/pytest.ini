[pytest]
# Treat warnings as failures so the suite stays clean, then allowlist the one known
# third-party deprecation: FastAPI's TestClient imports starlette's TestClient with
# httpx, which starlette now flags. Not our code, and out of our control until the
# pinned versions move. Any new warning from our own code still fails the run.
filterwarnings =
    error
    # Suppress starlette's TestClient httpx-deprecation by category, robust to message
    # rewording (a class rename would still surface, which is acceptable under pinned deps).
    ignore::starlette.exceptions.StarletteDeprecationWarning
